<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132238">
<title>1級電気工事施工管理技士 二次試験 記述練習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><small>1級電気工事施工管理技士・二次試験</small><h1>技術記述トレーニング</h1></div><button id="theme" aria-label="表示切替">◐</button></header>
<main>
<section class="stats">
 <div><b id="done">0</b><span>練習済み</span></div>
 <div><b id="mastered">0</b><span>理解できた</span></div>
 <div><b id="streak">0</b><span>連続日数</span></div>
</section>
<section class="toolbar">
 <select id="topic"></select>
 <button id="random">ランダム出題</button>
</section>
<article class="card">
 <div class="tag">記述問題</div><h2 id="title"></h2><p id="question" class="question"></p>
 <label for="answer">自分の解答</label>
 <textarea id="answer" placeholder="試験で書くつもりで、目的・原理・効果・留意点を簡潔に記述してください。"></textarea>
 <div class="count"><span id="chars">0</span>文字</div>
 <button class="primary" id="check">解答例と照合する</button>
 <div id="result" hidden>
   <h3>キーワード確認</h3><div id="score"></div><div id="keywords" class="chips"></div>
   <h3>解答例</h3><p id="model" class="model"></p>
   <div class="self"><span>この用語を理解できましたか？</span><button id="retry">要復習</button><button id="ok">理解できた</button></div>
 </div>
</article>
<section class="tips"><h3>記述の型</h3><p><b>①何か → ②何のためか → ③どう動くか → ④どんな効果か</b> の順に書くと、短い文章でも要点を整理しやすくなります。</p></section>
<section><h3>学習一覧</h3><div id="list" class="list"></div></section>
</main>
<footer>学習履歴はこの端末のブラウザ内に保存されます。</footer>
<script src="app.js"></script>
</body></html>
